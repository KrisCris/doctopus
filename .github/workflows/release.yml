name: Release

# Pushing a tag such as v0.2.0 builds the binaries for every target (see
# binaries.yml) and attaches them to a draft GitHub release. Running the
# workflow by hand builds and checks the binaries without releasing
# anything.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Do not set RUSTFLAGS here: it would replace the static-linking flags in
  # .cargo/config.toml.

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Check the tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag must match the crate version
        run: |
          crate=$(cargo pkgid -p doctopus | sed -E 's/.*[#@]//')
          if [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
            echo "tag $GITHUB_REF_NAME does not match crate version $crate" >&2
            exit 1
          fi

  build:
    name: Binaries
    needs: version
    # Also run by hand, when the version check is skipped.
    if: ${{ !failure() && !cancelled() }}
    # Without a cache, so a release is built from scratch.
    uses: ./.github/workflows/binaries.yml
    with:
      retention-days: 30

  publish:
    name: Draft the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft
