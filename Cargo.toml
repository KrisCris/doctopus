[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["The doctopus contributors"]
repository = "https://github.com/KrisCris/doctopus"
keywords = ["docx", "xlsx", "pptx", "visio", "llm"]
categories = ["command-line-utilities", "parser-implementations", "text-processing"]

[workspace.dependencies]
doctopus-core = { path = "crates/doctopus-core", version = "0.1.0" }
doctopus-office = { path = "crates/doctopus-office", version = "0.1.0" }
doctopus-archive = { path = "crates/doctopus-archive", version = "0.1.0" }
doctopus-pdf = { path = "crates/doctopus-pdf", version = "0.1.0" }
doctopus-text = { path = "crates/doctopus-text", version = "0.1.0" }

anyhow = "1.0.100"
calamine = "0.37.0"
cfb = "0.15.0"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
codepage = "0.1.3"
encoding_rs = "0.8.42"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# hayro 0.7 and later need Rust 1.92; 0.6 builds with the workspace's 1.88.
hayro-interpret = "0.6.0"
hayro-syntax = "0.6.0"
imagesize = "0.15.0"
insta = "1.49.0"
kurbo = "0.13.1"
png = "0.18.1"
quick-xml = "0.42.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = "1.18.1"
# Pure-Rust inflate only: no C libraries, so release binaries stay fully static.
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Picture decoders are slow without optimization, and the tests decode
# full-page scans.
[profile.dev.package.hayro-jpeg2000]
opt-level = 3

# `panic` stays "unwind": the engine turns a panic inside a reader into an
# error for that one document instead of losing the whole run.
[profile.release]
codegen-units = 1
lto = "fat"
strip = true

# `cargo build --profile dist` is what release CI uses.
[profile.dist]
inherits = "release"
