# cargo-deny: dependency licenses, security advisories and sources.
# Run locally with `cargo deny check` (cargo install cargo-deny).

[graph]
all-features = false

[advisories]
version = 2

[licenses]
version = 2
# Permissive licenses only: release binaries bundle every dependency.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
